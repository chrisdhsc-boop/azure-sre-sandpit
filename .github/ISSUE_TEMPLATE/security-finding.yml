name: Security finding
description: A vulnerability or misconfiguration to fix in Terraform
title: "[security] <resource>: <finding>"
labels: [security]
body:
  - type: input
    id: resource
    attributes: { label: Azure resource ID }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: What was found and how }
  - type: textarea
    id: fix
    attributes: { label: Proposed Terraform change, render: hcl }